name: "GLPI development environment image"

env:
  GHCR_IMAGE: "ghcr.io/glpi-project/glpi-development-env"
  # PHP version that also gets the `latest` tag
  LATEST_PHP_VERSION: "8.5"

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/glpi-development-env.yml"
      - ".github/actions/bake-php-matrix/**"
      - "glpi-development-env/**"
      - "githubactions-base/**"
      - "docker-bake.hcl"
  pull_request:
    paths:
      - ".github/workflows/glpi-development-env.yml"
      - ".github/actions/bake-php-matrix/**"
      - "glpi-development-env/**"
      - "githubactions-base/**"
      - "docker-bake.hcl"
  schedule:
    - cron:  '0 0 * * 1'
  # Enable manual run
  workflow_dispatch:

# Cancel the previous run of a pull request when it is updated (other events have a unique group and are never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: "Prepare"
    runs-on: "ubuntu-latest"
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "List PHP versions"
        id: "matrix"
        uses: "./.github/actions/bake-php-matrix"
        with:
          target: "glpi-development-env"

  build:
    name: "Build PHP ${{ matrix.php.php-version }} [${{ matrix.platform.suffix }}]"
    runs-on: "${{ matrix.platform.runner }}"
    needs: [prepare]
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.repository == 'glpi-project/docker-images' }}
      # Secrets are not available on pull requests coming from forks (and Dependabot)
      DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_TOKEN != '' }}
      # Only the arm64 caches are suffixed: the amd64 ones (including the base images) are shared with the other workflows
      GHA_CACHE: "true"
      CACHE_SUFFIX: ${{ matrix.platform.suffix == 'arm64' && '-arm64' || '' }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.prepare.outputs.matrix) }}
        platform:
          - { arch: "linux/amd64", runner: "ubuntu-26.04", suffix: "amd64" }
          - { arch: "linux/arm64", runner: "ubuntu-26.04-arm", suffix: "arm64" }
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Docker metadata"
        id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          bake-target: "docker-metadata-action"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Login to DockerHub"
        if: ${{ env.DOCKER_HUB_LOGIN == 'true' }}
        uses: "docker/login-action@v4"
        with:
          username: "${{ secrets.DOCKER_HUB_USERNAME }}"
          password: "${{ secrets.DOCKER_HUB_TOKEN }}"

      - name: "Login to Github container registry"
        if: ${{ env.PUSH == 'true' }}
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: "${{ secrets.GHCR_USERNAME }}"
          password: "${{ secrets.GHCR_ACCESS_TOKEN }}"

      - name: "Build and push by digest"
        id: "build"
        uses: "docker/bake-action@v7"
        env:
          DOCKER_BUILD_SUMMARY: ${{ runner.debug == '1' }}
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          targets: "${{ matrix.php.target }}"
          set: |
            *.platform=${{ matrix.platform.arch }}
            ${{ env.PUSH == 'true' && format('{0}.attest=type=sbom', matrix.php.target) || '' }}
            ${{ env.PUSH == 'true' && format('{0}.attest=type=provenance,mode=max', matrix.php.target) || '' }}
            ${{ matrix.php.target }}.output=type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}

      - name: "Export digest"
        if: ${{ env.PUSH == 'true' }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ fromJSON(steps.build.outputs.metadata)[matrix.php.target]['containerimage.digest'] }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}-${{ matrix.platform.suffix }}"

      - name: "Upload digest"
        if: ${{ env.PUSH == 'true' }}
        uses: "actions/upload-artifact@v7"
        with:
          name: "digests-glpi-development-env-${{ matrix.php.php-version }}-${{ matrix.platform.suffix }}"
          path: "${{ runner.temp }}/digests/*"
          if-no-files-found: "error"
          retention-days: 1

  merge-manifests:
    name: "Merge manifests [PHP ${{ matrix.php.php-version }}]"
    runs-on: "ubuntu-latest"
    needs: [prepare, build]
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'glpi-project/docker-images' }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: "Download digests"
        uses: "actions/download-artifact@v8"
        with:
          path: "${{ runner.temp }}/digests"
          pattern: "digests-glpi-development-env-${{ matrix.php.php-version }}-*"
          merge-multiple: true
      - name: "Verify digests"
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          if [ -z "$(ls --almost-all ${{ runner.temp }}/digests)" ]; then
            echo "::error::No digest files found for PHP ${{ matrix.php.php-version }}! Build jobs may have failed or artifacts expired."
            exit 1
          fi
      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Login to Github container registry"
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: "${{ secrets.GHCR_USERNAME }}"
          password: "${{ secrets.GHCR_ACCESS_TOKEN }}"
      - name: "Docker metadata"
        id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.php.php-version }}
            type=raw,value=latest,enable=${{ matrix.php.php-version == env.LATEST_PHP_VERSION }}
      - name: "Create and push manifest"
        working-directory: "${{ runner.temp }}/digests"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Read digest files (named like <hash>-<arch>) and prepare source array
          GHCR_SOURCES=""
          for file_path in "$PWD"/*; do
            file_name="${file_path##*/}"
            hash="${file_name%%-*}"
            GHCR_SOURCES="$GHCR_SOURCES ${{ env.GHCR_IMAGE }}@sha256:$hash"
          done

          # Create manifest for GHCR
          GHCR_TAGS=$(echo "$TAGS" | grep "^${{ env.GHCR_IMAGE }}" | xargs --replace={} echo "-t {}" | tr '\n' ' ')
          if [[ -n "$GHCR_TAGS" ]]; then
            echo "Creating GHCR manifest..."
            docker buildx imagetools create $GHCR_TAGS $GHCR_SOURCES
          fi
