name: "Github actions Memcached image"

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/githubactions-memcached.yml"
      - "githubactions-memcached/**"
  pull_request:
    paths:
      - ".github/workflows/githubactions-memcached.yml"
      - "githubactions-memcached/**"
  schedule:
    - cron:  '0 0 * * 1'
  # Enable manual run
  workflow_dispatch:

# Cancel the previous run of a pull request when it is updated (other events have a unique group and are never cancelled)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: "ubuntu-latest"
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.repository == 'glpi-project/docker-images' }}
      # Secrets are not available on pull requests coming from forks (and Dependabot)
      DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_TOKEN != '' }}
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"
      - name: "Login to DockerHub"
        if: ${{ env.DOCKER_HUB_LOGIN == 'true' }}
        uses: "docker/login-action@v4"
        with:
          username: "${{ secrets.DOCKER_HUB_USERNAME }}"
          password: "${{ secrets.DOCKER_HUB_TOKEN }}"
      - name: "Login to Github container registry"
        if: ${{ env.PUSH == 'true' }}
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: "${{ secrets.GHCR_USERNAME }}"
          password: "${{ secrets.GHCR_ACCESS_TOKEN }}"
      - name: "Build and push"
        uses: "docker/build-push-action@v7"
        with:
          build-args: |
            BASE_IMAGE=memcached
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"
          context: "githubactions-memcached"
          outputs: "type=image,push=${{ env.PUSH }}"
          pull: true
          tags: "ghcr.io/glpi-project/githubactions-memcached:latest"
